<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>아쿠아렌즈 계정</title><body><main><h1>아쿠아렌즈 계정</h1><p id="state">로그인 상태 확인 중…</p><input id="email" type="email" placeholder="이메일"><input id="password" type="password" placeholder="비밀번호 (6자 이상)"><button id="login">로그인</button><button id="signup">새 계정 만들기</button><button id="logout">로그아웃</button><a href="./">메인 앱으로 돌아가기</a></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';import{getAuth,setPersistence,indexedDBLocalPersistence,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut}from'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';const app=initializeApp({apiKey:'AIzaSyD26n5RrzPCSKpz5VUVQnqVjvjma8iSeVA',authDomain:'aqua-c4cba.firebaseapp.com',projectId:'aqua-c4cba',appId:'1:996669944105:web:ba7aa75f90f9d3f4750738'}),auth=getAuth(app),$=x=>document.querySelector(x),cred=()=>[$('#email').value,$('#password').value],go=()=>location.href='./?account=ok';await setPersistence(auth,indexedDBLocalPersistence);onAuthStateChanged(auth,u=>{ $('#state').textContent=u?`회원 · ${u.email}`:'비회원';if(u)setTimeout(go,700)});$('#login').onclick=async()=>{try{await signInWithEmailAndPassword(auth,...cred())}catch(e){alert(e.code)}};$('#signup').onclick=async()=>{try{await createUserWithEmailAndPassword(auth,...cred())}catch(e){alert(e.code)}};$('#logout').onclick=()=>signOut(auth);</script></body></html>
